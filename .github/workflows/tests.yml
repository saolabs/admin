name: Release checks

on:
  push:
    branches: [main, 'release/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  COMPOSER_ROOT_VERSION: 0.1.0-alpha.1

jobs:
  php:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {php: '8.3', framework: '12.0', testbench: '10.0'}
          - {php: '8.5', framework: '12.0', testbench: '10.0'}
          - {php: '8.3', framework: '13.0', testbench: '11.0'}
          - {php: '8.5', framework: '13.0', testbench: '11.0'}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, dom, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - run: composer validate --strict --no-interaction
      - run: composer update --prefer-dist --no-interaction --with 'laravel/framework:^${{ matrix.framework }}' --with 'orchestra/testbench:^${{ matrix.testbench }}'
      - run: composer test

  packaged-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, dom, zip, sqlite3, pdo_sqlite
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: composer update --prefer-dist --no-interaction --with 'laravel/framework:^12.0' --with 'orchestra/testbench:^10.0'
      - run: npm ci --ignore-scripts
      - name: Compile and build the published frontend using installed packages
        run: |
          SAOLA_ADMIN_PREVIEW_DIR="$RUNNER_TEMP/admin-preview" vendor/bin/phpunit --filter test_ssr_compiles
          npm run build:preview -- "$RUNNER_TEMP/admin-preview"
      - name: Check live Laravel HTTP on a disposable SQLite database
        run: |
          SAOLA_ADMIN_PREVIEW_DIR="$RUNNER_TEMP/admin-preview" php -S 127.0.0.1:8769 -t "$RUNNER_TEMP/admin-preview/public" workbench/serve-preview.php > "$RUNNER_TEMP/admin-http.log" 2>&1 &
          admin_http_pid=$!
          trap 'kill "$admin_http_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8769/control > /dev/null; then break; fi
            sleep 1
          done
          python3 workbench/check-http.py
      - name: Check Composer archive inventory and source publication
        run: |
          composer archive --format=zip --dir="$RUNNER_TEMP" --file=saola-admin
          php workbench/check-archive.php "$RUNNER_TEMP/saola-admin.zip"
